services:
  xdns:
    build: .
    image: xdns:latest
    pull_policy: build # 每次 docker compose up -d 自动重建镜像，代码改动直接生效
    container_name: xdns
    restart: unless-stopped
    ports:
      - "${XDNS_PORT:-3090}:3090" # 宿主机端口可用 .env 的 XDNS_PORT 覆盖
    environment:
      # 首次启动时创建 admin 账号的初始密码；不设置则控制台打印随机密码
      # XDNS_ADMIN_PASSWORD: "change-me"
      # Node 进程内时区（影响 SQLite datetime('now','localtime')）
      TZ: Asia/Shanghai
    volumes:
      # SQLite 数据库持久化：accounts / users / sessions 都在这里
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
